name: G02 AI Agent — Machine Listening & Execution Evidence

on:
  workflow_dispatch:
  push:
    branches: [g02-ai-agent-20260929]

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  g02:
    name: G02 Runner Agent
    runs-on: [self-hosted, lingo-g02]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute G02 agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            python .github/lingo-g02-agent/g02_agent.py
          else
            python3 .github/lingo-g02-agent/g02_agent.py
          fi
      - name: G02 sentinel
        shell: bash
        run: |
          echo "G02_SENTINEL_EXECUTED=true"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_ID=$RUNNER_ID"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "JOB_ID=$GITHUB_JOB"
