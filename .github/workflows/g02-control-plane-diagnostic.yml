name: G02 Control Plane Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [g02-runner-recovery-20260929]

jobs:
  control-plane:
    name: G02 Control Plane Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sentinel
        shell: bash
        run: |
          set -euxo pipefail
          echo "CONTROL_PLANE_DIAGNOSTIC=true"
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_ID=${RUNNER_ID}"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          date -u
