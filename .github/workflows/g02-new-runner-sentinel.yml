name: G02 New Runner Connectivity Sentinel

on:
  workflow_dispatch:
  push:
    branches: [g02-runner-recovery-20260929]

permissions:
  contents: read

jobs:
  sentinel:
    name: New G02 Runner Sentinel
    runs-on: [self-hosted, linux, x64, lingo-g02]
    timeout-minutes: 10
    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euxo pipefail
          echo "G02_NEW_RUNNER_SENTINEL=true"
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_ID=${RUNNER_ID:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "RUN_ID=${GITHUB_RUN_ID:-}"
          echo "JOB=${GITHUB_JOB:-}"
          uname -a
          id
          pwd
          date -u

      - name: Host and listener telemetry
        shell: bash
        run: |
          set -u
          mkdir -p g02-evidence
          {
            echo "=== TIME ==="; date -u
            echo "=== IDENTITY ==="; id
            echo "=== HOST ==="; uname -a
            echo "=== RUNNER ENV ==="
            env | sort | grep -E '^(RUNNER_|GITHUB_RUN_ID|GITHUB_JOB|GITHUB_REPOSITORY|GITHUB_SHA)=' || true
            echo "=== PROCESSES ==="
            pgrep -af 'Runner.Listener|Runner.Worker|runsvc.sh|run.sh' || true
            echo "=== SERVICE ==="
            systemctl list-units --type=service --all 2>/dev/null | grep -i 'actions.runner' || true
            echo "=== RUNNER DIAGNOSTICS ==="
            find "${RUNNER_TOOL_CACHE:-/nonexistent}" -maxdepth 0 -type d -print 2>/dev/null || true
            find "${RUNNER_WORKSPACE:-/nonexistent}" -maxdepth 0 -type d -print 2>/dev/null || true
          } | tee g02-evidence/host-telemetry.txt

      - name: GitHub allocation proof
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import json, os, urllib.request, time
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.load(r)
          rows = []
          for job in data.get("jobs", []):
              row = {
                  "job_id": job.get("id"),
                  "name": job.get("name"),
                  "status": job.get("status"),
                  "conclusion": job.get("conclusion"),
                  "runner_id": job.get("runner_id"),
                  "runner_name": job.get("runner_name"),
                  "steps_count": len(job.get("steps") or []),
              }
              rows.append(row)
              print(json.dumps(row, sort_keys=True))
          with open("g02-evidence/github-jobs.json", "w") as f:
              json.dump({"run_id": run_id, "jobs": rows}, f, indent=2, sort_keys=True)

      - name: Sentinel success marker
        shell: bash
        run: |
          set -euxo pipefail
          test -n "${RUNNER_NAME:-}"
          test -n "${RUNNER_ID:-}"
          test "${RUNNER_ID}" != "0"
          cat > g02-evidence/G02_SENTINEL_SUCCESS.txt <<EOF
G02_SENTINEL_SUCCESS=true
RUNNER_ID=${RUNNER_ID}
RUNNER_NAME=${RUNNER_NAME}
RUN_ID=${GITHUB_RUN_ID}
JOB=${GITHUB_JOB}
SHA=${GITHUB_SHA}
TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
EOF

      - name: Package runner diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p g02-evidence/diag
          find . -maxdepth 3 -type f -path '*/_diag/*' -print -exec tail -n 300 {} \; > g02-evidence/diag/runner-diagnostics.txt 2>&1
          sha256sum g02-evidence/* g02-evidence/diag/* 2>/dev/null | sort > g02-evidence/SHA256SUMS.txt

      - name: Upload G02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-live-evidence-${{ github.run_id }}
          path: g02-evidence/
          if-no-files-found: error
          retention-days: 14
