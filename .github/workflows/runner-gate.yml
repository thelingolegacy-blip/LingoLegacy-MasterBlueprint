name: Lingo Legacy Runner Gate

on:
  push:
    branches: ["recovery/runner-gate-2026-09-22"]
  workflow_dispatch:
  pull_request:

jobs:
  runner-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execution Sentinel
        run: |
          echo "RUNNER_GATE_SENTINEL=EXECUTED"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
